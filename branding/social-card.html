<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ColorBench — Can a model see color?</title>
  <style>
    @font-face { font-family: Bench; src: url('../src/assets/DejaVuSans.ttf'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #152e39; color: #152e39; font-family: Bench, sans-serif; padding: 12px; }
    main { position: relative; height: 606px; background: #fff7e9; overflow: hidden; }
    h1 { position: absolute; left: 46px; top: 176px; margin: 0; font-size: 84px; font-weight: 400; letter-spacing: -5px; }
    p { position: absolute; left: 50px; top: 292px; margin: 0; font-size: 29px; letter-spacing: -1px; }
    .samples { position: absolute; left: 50px; bottom: 84px; display: flex; gap: 14px; }
    .samples span { display: block; width: 52px; height: 7px; background: var(--color); }
    svg { position: absolute; right: 44px; top: 65px; }
  </style>
</head>
<body>
  <main>
    <h1>ColorBench</h1>
    <p>Can a model see color?</p>
    <div class="samples" aria-hidden="true">
      <span style="--color:#ec4899"></span><span style="--color:#f97316"></span>
      <span style="--color:#eab308"></span><span style="--color:#22c55e"></span>
      <span style="--color:#06b6d4"></span><span style="--color:#3b82f6"></span>
      <span style="--color:#8b5cf6"></span>
    </div>
    <svg width="442" height="486" viewBox="0 0 442 486" fill="none" aria-hidden="true">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#152e39" opacity=".17"/></pattern>
        <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="9" flood-color="#152e39" flood-opacity=".15"/></filter>
        <linearGradient id="spectrum" x1="54" y1="0" x2="378" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ec4899"/><stop offset=".22" stop-color="#f97316"/><stop offset=".4" stop-color="#eab308"/><stop offset=".57" stop-color="#22c55e"/><stop offset=".74" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      </defs>
      <path fill="url(#dots)" d="M0 0h442v486H0z"/>
      <rect x="83" y="35" width="297" height="358" rx="46" fill="#c4b5fd" transform="rotate(8 83 35)"/>
      <g filter="url(#shadow)">
        <rect x="28" y="74" width="364" height="354" rx="34" fill="#fffdfa" stroke="#152e39" stroke-width="7"/>
        <rect x="54" y="100" width="94" height="82" rx="12" fill="#fda4af"/>
        <rect x="162" y="100" width="94" height="82" rx="12" fill="#fdba74"/>
        <rect x="270" y="100" width="94" height="82" rx="12" fill="#fde047"/>
        <rect x="54" y="196" width="94" height="82" rx="12" fill="#86efac"/>
        <rect x="162" y="196" width="94" height="82" rx="12" fill="#67e8f9"/>
        <rect x="270" y="196" width="94" height="82" rx="12" fill="#93c5fd"/>
        <rect x="54" y="292" width="94" height="82" rx="12" fill="#c4b5fd"/>
        <rect x="162" y="292" width="94" height="82" rx="12" fill="#d8b4fe"/>
        <rect x="270" y="292" width="94" height="82" rx="12" fill="#f9a8d4"/>
        <path d="M58 399h303" stroke="url(#spectrum)" stroke-width="7" stroke-linecap="round"/>
      </g>
      <circle cx="365" cy="81" r="22" fill="#152e39"/><path d="M355 81h20M365 71v20" stroke="#fff7e9" stroke-width="2"/>
    </svg>
  </main>
</body>
</html>
